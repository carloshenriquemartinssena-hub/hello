name: CRM Brasil · Rotina diária
on:
  schedule:
    # Acordar o serviço às 08:50/08:55 de Brasília, sem disparos.
    - cron: "50,55 11 * * *"
    # Preparar novamente 5–10 minutos antes dos lotes seguintes.
    - cron: "10,15,30,35 12 * * *"
    # Brasília UTC-3: três lotes de até 20, respeitando 30 novos + 30 follow-ups.
    - cron: "0,20,40 12 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: "Preparar o serviço ou executar o lote (somente 09h–10h)"
        type: choice
        options: [prepare, run]
        default: prepare
permissions:
  contents: read
concurrency:
  group: crm2-brasil-automation
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Executar rotina do CRM 2 independente do painel Streamlit
        env:
          CRM2_SECRETS_TOML: ${{ secrets.CRM2_SECRETS_TOML }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_OPERATION: ${{ inputs.operation }}
        run: |
          set -eu
          test -n "$CRM2_SECRETS_TOML"
          operation=prepare
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            operation="$MANUAL_OPERATION"
          elif [ "$EVENT_SCHEDULE" = "0,20,40 12 * * *" ]; then
            operation=run
          fi
          case "$operation" in prepare|run) ;; *) exit 1 ;; esac
          # Sem retries de envios. Usa o Supabase e as mesmas reservas do painel.
          python -m crm.worker --operation "$operation"
